# chat-demo 的 Docker Compose 部署
#
#   docker compose up -d --build      # 构建并启动
#   docker compose logs -f            # 查看日志
#   docker compose down               # 停止
#
# 打开 http://localhost:8080 即可使用。
# 默认不预置任何厂商：第一次打开时在「设置 → 模型服务」里添加（支持任意 OpenAI 兼容接口）。

services:
  # 静态站点：nginx + 运行时配置（config.js）
  web:
    build:
      context: .
      target: web
    image: chat-demo-web:latest
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      # 浏览器把厂商请求发到这个同源地址，由 api 服务转发；留空则浏览器直连厂商
      CHAT_PROXY_URL: ${CHAT_PROXY_URL:-/api/proxy}
      CHAT_PROXY_TOKEN: ${CHAT_PROXY_TOKEN:-}
      # 可选：预置厂商列表（JSON 数组），首次打开时出现在设置里
      CHAT_PROVIDERS: ${CHAT_PROVIDERS:-[]}
    depends_on:
      - api
    restart: unless-stopped

  # 转发代理：绕开第三方模型接口的跨域限制，原样转发流式响应
  api:
    build:
      context: .
      target: proxy
    image: chat-demo-proxy:latest
    environment:
      PORT: '8787'
      # 与 web 的 CHAT_PROXY_TOKEN 保持一致；留空表示不校验
      PROXY_TOKEN: ${CHAT_PROXY_TOKEN:-}
      # 只允许转发到这些域名（逗号分隔）；留空表示不限制，公网部署建议填写
      PROXY_ALLOWED_HOSTS: ${PROXY_ALLOWED_HOSTS:-}
    expose:
      - '8787'
    restart: unless-stopped
